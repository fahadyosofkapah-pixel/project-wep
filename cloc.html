<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tasks</title>
     
<style>
*{
    font-family: sans-serif;
}
.clock{
    width: 500px;
    height: 500px;
    border: 20px solid rgb(18, 151, 228);
    border-radius: 50%;
    margin: 0 auto;
    position: relative;
}
.point{
    width: 20px;
    height: 20px;
    background-color: rgb(25, 80, 23);
    position: absolute;
    top: 240px;
    left: 240px;
    border-radius: 50px;
}
.hour{
    font-size: 30px;
    font-weight: bold;
    color: rgb(7, 32, 32);
    position: absolute;
}
.hours-1{
    top:40px ;
    right: 130px;

}

.hours-2{
    top:135px ;
    right: 45px;

}
.hours-3{
    top:235px ;
    right: 10px;

}
.hours-4{
    top:345px ;
    right: 45px;

}
.hours-5{
    top:430px ;
    right: 130px;

}
.hours-6{
    bottom:10px ;
    left: 240px;

}
.hours-7{
    top:430px ;
    left: 130px;

}
.hours-8{
    top:345px ;
left: 45px;

}
.hours-9{
    top:235px ;
left: 10px;

}
.hours-10{
    top:125px ;
left: 45px;

}
.hours-11{
    top:40px ;
left: 130px;

}
.hours-12{
    top:10px ;
left: 245px;
}
.brand {
  font-size: 20px;
  font-weight: bold;
  color: #8a1c00;
  position: absolute;
  top: 90px;
  left: 42.5%;
}

.minute-hand-wrapper {
  width: 400px;
  height: 400px;
  /* background-color: #2a2f5c; */
  position: absolute;
  left: 50px;
  top: 50px;
  border-radius: 240px;
}
.minute-hand{
    position: relative;
}
.minute-hand .hand {
  width: 4px;
  height: 200px;
  background-color: #446940;
  position: absolute;
  left: 198px;
}

.minute-hand .arrow {
  font-size: 30px;
  font-weight: bold;
  color: #404b69;
  transform: rotate(180deg);
  position: absolute;
  left: 191px;
  top: -12px;
}
.hour-hand-wrapper {
  width: 300px;
  height: 300px;
  position: absolute;
  top: 100px;
  left: 100px;
  border-radius: 50%;
}

.hour-hand {
  position: relative;
}
.hour-hand .hand {
  width: 4px;
  height: 150px;
  background-color: #404b69;
  position: absolute;
  left: 148px;
}

.hour-hand .arrow {
  font-size: 30px;
  font-weight: bold;
  color: #404b69;
  transform: rotate(180deg);
  position: absolute;
  left: 140px;
  top: -7px;
}
.second-hand-wrapper {
  width: 350px;
  height: 350px;
  position: absolute;
  top: 75px;
  left: 75px;
  border-radius: 50%;
}

.second-hand {
  position: relative;
}
.second-hand .hand {
  width: 2px;
  height: 175px;
  background-color: #404b69;
  position: absolute;
  left: 174px;
}




</style>
</head>

<body>
    <div class="clock">
        <div class="point"></div>
        <div class="hour hours-1">1</div>
        <div class=" hour hours-2">2</div>
        <div class=" hour hours-3">3</div>
        <div class="hour hours-4">4</div>
        <div class=" hour hours-5">5</div>
        <div class="hour hours-6">6</div>
        <div class="hour hours-7">7</div>
        <div class="hour hours-8">8</div>
        <div class=" hour hours-9">9</div>
        <div class="hour hours-10">10</div>
        <div class=" hour hours-11">11</div>
        <div class=" hour hours-12">12</div>
        <div class="brand">AJANTA</div>
        <div class="minute-hand-wrapper" id="minute-hand">
            <div class="minute-hand">
                <div class="hand"></div>
                <div class="arrow">v</div>
            </div>
        </div>
        <div class="hour-hand-wrapper" id="hour-hand">
            <div class="hour-hand">
                <div class="hand"></div>
                <div class="arrow">V</div>
            </div>
        </div>
        <div class="second-hand-wrapper" id="second-hand">
            <div class="second-hand">
                <div class="hand"></div>
            </div>
        </div>

    </div>
    <script>
        var second = 0;
var minute = 0;
var hour = 0;
var d = new Date();

setInterval(
  function() {
    d = new Date();
    second = d.getSeconds() * 6;
    minute = d.getMinutes() * 6;
    hour = d.getHours() * 30;
    document.getElementById( "second-hand").style.transform= "rotate(" + second + "deg)";
    document.getElementById("minute-hand").style.transform= "rotate(" + minute + "deg)";
    document.getElementById("hour-hand").style.transform= "rotate(" + hour + "deg)";
  }, 1000
);
    </script>
</body>

</html>
