<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <!-- <link rel="stylesheet" href="./assets/script.js"> -->
  <title>project</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: sans-serif;
  }

  body {
    height: 100%;
   width: 100%;

  
    background-image: linear-gradient(to bottom right, rgba(79,51,176,1),rgba(210,53,165));
}   
  

  nav {
    padding: 10px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #1e293b;
    position: fixed;
    width: 100%;
    height: 70px;
    z-index: 1000;
  }


  .logo {
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }

  nav ul {
    display: flex;
    gap: 30px;
    align-items: center;
  }

  nav ul li {
    list-style-type: none;
  }

  nav ul li a {
    text-decoration: none;
    color: white;
  }

  nav ul li a:hover {
    color: #162530;
    background: rgba(188, 212, 229, 0.8);
    border-radius: 15px rgba(20, 30, 38, 0.8);
  }

  .menu-icon {
    color: #fff;
    font-size: 30px;
    display: none;
  }

  @media (max-width: 600px) {
    nav ul {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      padding: 0 19px;
      flex-direction: column;
      align-items: start;
      text-align: start;
      background-color: rgb(8, 8, 96);
      gap: 0;
      overflow: hidden;
    }

    nav ul li {
      padding: 20px;
    }

    .menu-icon {
      display: block;
      z-index: 1001;
      cursor: pointer;
    }

    menuList {
      transition: all 0.5s;
    }
  }

  /* to do list*/
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .container {
    width: 100%;
    min-height: 100vh;
    /* background-color: #222223; */
    background-repeat: no-repeat;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    width: 50%;
    max-width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 40px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 5px 5px 25px rgba(0, 0, 0, 0.2);
  }

  * h1 {
    color: white;
    font-size: 40px;
    font-weight: bold;
    text-align: center;
  }

  #task {
    width: 100%;
    background: rgba(255, 255, 255, 0.1);
    border: 0;
    outline: 0;
    padding: 15px;
    border-radius: 15px;
    color: white;
  }

  #task::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }

  .input-container {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #add-task-btn {
    background-color: rgba(255, 255, 255, 0.1);
    border: 0;
    width: 40px;
    height: 40px;
    border-radius: 5px;
    font-size: 1.6rem;
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;

  }

  .todo-container {
    display: flex;
    justify-content: space-between;
    background-color: rgba(255, 255, 255, 0.1);
    padding: 20px;
    border: 10px;
    color: white;
  }

  #tasks-container {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .delete-button {
    color: rgba(255, 255, 255, 0.6);
    background-color: transparent;
    border: 0;
    color: red;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 0.2ch;
    cursor: pointer;
  }

  /* calculator */

  * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    outline: 0;
    transition: all 0.5s;
  }

  body {
    font-family: sans-serif;
  }

  a {
    text-decoration: none;
    color: #fff;
  }
  .containers {
    height: 100vh;
    width: 100%;
    display: grid;
    place-items: center;
    scroll-margin-top: 80px;

  }

  .calculator {
    position: relative;
    height: auto;
    width: auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 30px #000;
    scroll-margin-bottom: 80px;
  }

  .theme-toggler {
    position: absolute;
    top: 30px;
    right: 30px;
    color: #fff;
    cursor: pointer;
    z-index: 1;
  }

  .theme-toggler.active {
    color: #000;
  }

  .theme-toggler.active::before {
    background-color: #fff;
  }

  .theme-toggler::before {
    content: '';
    height: 30px;
    width: 30px;
    position: absolute;
    top: 50px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background-color: #000;
    z-index: 1;
  }

  #display {
    margin: 0 10px;
    height: 150px;
    width: auto;
    max-width: 270px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    font-size: 30px;
    margin-bottom: 20px;
    overflow-x: scroll;

  }

  #display::-webkit-scrollbar {
    display: block;
    height: 3px;
  }

  button {
    height: 60px;
    width: 60px;
    border: 0;
    border-radius: 30px;
    margin: 5px;
    font-size: 20px;
    cursor: pointer;
    transition: all 200ms ease;
  }

  button:hover {
    transform: scale(1.15);
  }

  button.btn-equal {
    height: 130px;
    color: white;
  }

  .calculator {
    background-color: #fff;
  }

  .calculator #display {
    color: #000;
  }

  .calculator button#clear {
    background-color: #ffd5d8;
    color: red;
  }

  .calculator button.btn-number {
    background-color: #c3eaff;
    color: #000;
  }

  .calculator button.btn-operator {
    background-color: #ffd0fd;
    color: #f967f3;
  }

  .calculator button.btn-equal {
    background-color: #adf9e7;
    color: #000;
  }

  .calculator.dark {
    background-color: #071115;
  }

  .calculator.dark #display {
    color: #f8fafd;
  }

  .calculator.dark button#clear {
    background-color: #2d191e;
    color: #bd3740;
  }

  .calculator.dark button.btn-number {
    background-color: #1b2f38;
    color: #f8fafb;
  }

  .calculator.dark button.btn-operator {
    background-color: #2e1f39;
    color: #aa00a4;
  }

  .calculator.dark button.btn-equal {
    background-color: #223323;
    color: #ffffff;

    section {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease;
    }

    section.show {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<body>
  <nav>
    <div class="logo">
      <img src="./yiksi.png" width="58px" alt="">
      <h1>Yiksi</h1>
    </div>

    <ul id="menuList">
      <li>
        <a href="#to do list">to do list</a>
      </li>
      <li>
        <a href="#calculator">calculator</a>
      </li>
      <li>
        <a href="# analog">analog</a>
      </li>
      <li>
        <a href="#clock">clock</a>
      </li>

    </ul>
    <div class="menu-icon" id="menuIcon" onclick="toggleMenu()">
      <i class="fa-solid fa-bars"></i>
    </div>
  </nav>
  <!-- to do list -->
  <div class="container" id="to do list">
    <div class="card">
      <h1>To Do list</h1>
      <div class="input-container">
        <input type="text" name="task" id="task" placeholder="add a task" />
        <button id="add-task-btn">+</button>
      </div>
      <div id="tasks-container"></div>
    </div>
  </div>
  <!-- calculator -->
  <div class="containers" id="calculator">
    <div class="calculator dark">
      <div class="theme-toggler active">
        <i class="toggler-icon"></i>
      </div>
      <div class="disply-screen">
        <div id="display"></div>
      </div>
      <div class="buttons">
        <table>
          <tr>
            <td><button class="btn-operator" id="clear">C</button></td>
            <td><button class="btn-operator" id="/">&divide</button></td>
            <td><button class="btn-operator" id="*">&times</button></td>
            <td><button class="btn-operator" id="backspace">⌫</button></td>
          </tr>
          <tr>
            <td><button class="btn-number" id="7">7</button></td>
            <td><button class="btn-number" id="8">8</button></td>
            <td><button class="btn-number" id="9">9</button></td>
            <td><button class="btn-operator" id="-">-</button></td>
          </tr>
          <tr>
            <td><button class="btn-number" id="4">4</button></td>
            <td><button class="btn-number" id="5">5</button></td>
            <td><button class="btn-number" id="6">6</button></td>
            <td><button class="btn-operator" id="+">+</button></td>
          </tr>
          <tr>
            <td><button class="btn-number" id="1">1</button></td>
            <td><button class="btn-number" id="2">2</button></td>
            <td><button class="btn-number" id="3">3</button></td>
            <td rowspan="2"><button class="btn-equal" id="=">=</button></td>
          </tr>
          <tr>
            <td><button class="btn-operator" id="(">(</button></td>
            <td><button class="btn-number" id="0">0</button></td>
            <td><button class="btn-operator" id=")">)</button></td>
          </tr>
        </table>
      </div>
    </div>
  </div>
  <script>
    let menuList = document.getElementById("menuList");

    menuList.style.maxHeight = "0px";
    function toggleMenu() {
      if (menuList.style.maxHeight == "0px") {
        menuList.style.maxHeight = "500px";
      } else {
        menuList.style.maxHeight = "0px";
      }
    }
    const task = document.getElementById("task");
    const addTaskBtn = document.getElementById("add-task-btn");
    const taskContainer = document.getElementById("tasks-container");
    addTaskBtn.addEventListener("click", () => {
      const todoWrapper = document.createElement("div");
      const deleteButton = document.createElement("button");
      const taskText = document.createElement("p");
      todoWrapper.classList.add("todo-container");
      deleteButton.classList.add("delete-button");
      deleteButton.textContent = ("DELETE");
      taskText.classList.add("task-text");
      taskText.textContent = (task.value);
      todoWrapper.append(taskText);
      todoWrapper.append(deleteButton);
      taskContainer.append(todoWrapper);
      deleteButton.addEventListener("click", () => {
        todoWrapper.remove();
      })
      task.value = ""
    });
    let display = document.getElementById("display");
    let numbers = document.querySelectorAll(".btn-number");
    let operators = document.querySelectorAll(".btn-operator");
    let equal = document.querySelector(".btn-equal");
    let clear = document.getElementById("clear");
    let backspace = document.getElementById("backspace");
    let themeToggler = document.querySelector(".theme-toggler");
    let calculator = document.querySelector(".calculator");
    numbers.forEach(function (button) {
      button.addEventListener("click", function () {
        display.innerText += button.innerText;
      });
    });
    operators.forEach(function (button) {
      button.addEventListener("click", function () {
        let value = button.innerText;
        if (value !== "C" && value !== "⌫") {
          if (value === "×") {
            value = "*";
          }
          if (value === "÷") {
            value = "/";
          }
          display.innerText += value;
        }
      });

    });
    equal.addEventListener("click", function () {
      try {
        display.innerText = eval(display.innerText);
      } catch {
        display.innerText = "Error";
      }
    });
    clear.addEventListener("click", function () {
      display.innerText = "";
    });
    backspace.addEventListener("click", function () {
      display.innerText = display.innerText.slice(0, -1);
    });
    themeToggler.addEventListener("click", function () {
      calculator.classList.toggle("dark");
      themeToggler.classList.toggle("active");
    });
    const sections = document.querySelectorAll("section");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("show");
        }
      });
    }, {
      threshold: 0.2
    });
    sections.forEach((section) => {
      observer.observe(section);
    });
  </script>
</body>

</html>
