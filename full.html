<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style> 
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body {
  height: 100%;
  width: 100%;
  background-color: wheat;
}
nav {
  padding: 10px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: #1e293b;
  position: fixed;
  width: 100%;
  height: 70px;
}
.logo {
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
}

nav ul {
  display: flex;
  gap: 30px;
  align-items: center;
}
nav ul li {
  list-style-type: none;
}
nav ul li a {
  text-decoration: none;
  color: white;
}

nav ul li a:hover {
 color: #162530;
 background: rgba(188, 212, 229, 0.8);
 border-radius: 15px rgba(5, 134, 226, 0.8);
 } 

.menu-icon {
  color: #fff;
  font-size: 30px;
  display: none;
}
@media (max-width: 600px) {
  nav ul {
    position: absolute;
    top: 70px;
    left: 0;
    right: 0;
    padding: 0 19px;
    flex-direction: column;
    align-items: start;
    text-align: start;
    background-color: rgb(8, 8, 96);
    gap: 0;
    overflow: hidden;
  }
  nav ul li {
    padding: 20px;
  }
  .menu-icon {
    display: block;
    z-index: 1001;
    cursor: pointer;
  }
  menuList {
    transition: all 0.5s;
  }
}
/* to do list*/
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
 .container{
  width: 100%;
  min-height: 100vh;
  background-color:  rgba(239, 7, 7, 0.863);
  background-repeat: no-repeat;
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
} 
.card{
  width: 50%;
  max-width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding:40px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  backdrop-filter: blur(10px);
  box-shadow: 5px 5px 25px rgba( 0, 0, 0, 0.2);
}
h1{
  color: white;
  font-size: 40px;
  font-weight: bold;
  text-align: center;
}
#task{
  width: 100%;
  background: rgba(255, 255, 255, 0.1);
  border: 0;
  outline: 0;
  padding: 15px;
  border-radius: 15px ;
  color: white;
}
#task::placeholder{
  color: rgba(255, 255, 255, 0.6);
}
.input-container{
  margin-top: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
#add-task-btn{
  background-color: rgba(255, 255, 255, 0.1);
  border: 0;
  width: 40px;
  height: 40px;
  border-radius: 5px;
  font-size: 1.6rem;
  color: rgba(255, 255, 255, 0.6);
  cursor: pointer;

}
.todo-container{
  display: flex;
  justify-content: space-between;
  background-color: rgba(255, 255, 255, 0.1);
  padding: 20px;
  border: 10px;
  color: white;
}
#tasks-container{
  margin-top: 40px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
 
.delete-button{
  color: rgba(255, 255, 255, 0.6);
 background-color: transparent;
 border: 0;
color: red;
font-size: 1rem;
font-weight: bold;
letter-spacing: 0.2ch;
cursor: pointer;
}
/* shiine */
   *{
    margin: 0;
    padding: 0;
 }
 .section{
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 12px arial, Helvetice, sans-serif;
    background-color: aqua;
 }
 .clock{
    border: 1px solid #606060;
    color: white;
    padding: 40px;
    border-radius: 10px;
     background-color: #22222222;
}

#date{
    font-size: 20px !important;
    text-align: center;
}
.clock ul{
    list-style: none;
    display: flex;
    font-size: 90px;
    gap: 15px;
}  
</style>
<body>
      <nav>
    <div class="logo">
      <img src="./yiksi.png" width="58px" alt="">
      <h1>yiksi</h1>
    </div>

    <ul id="menuList">
      <li>
        <a href="#">calcul</a>
      </li>
      <li>
        <a href="#">watch</a>
      </li>
      <li>
        <a href="#">clock</a>
      </li>
       <li>
        <a href="#">to do</a>
      </li>
    </ul>
    <div class="menu-icon" id="menuIcon" onclick="toggleMenu()">
      <i class="fa-solid fa-bars"></i>
    </div>
  </nav>
  <!-- to do list -->
    <div class="container"> 
  <div class="card"> 
        <h1>To Do list</h1>
        <div class="input-container">
            <input type="text" name="task" id="task" placeholder="add a task" />
            <button id="add-task-btn">+</button>
        </div>
        <div id="tasks-container"></div>
    </div>
 </div>

 <!-- shhine -->

    <div class="section">
        <div class="clock">
            <div id="date"> wed 23 september 2026</div>
            <ul>
                <li id="hours">05</li>
                <li id="point">:</li>
                <li id="min">25</li>
                <li class="point">:</li>
                <li id="sec">50</li>
            </ul>
        </div>
    </div>
   <script>
    let menuList = document.getElementById("menuList");
 
    menuList.style.maxHeight = "0px";


    function toggleMenu() {
      if (menuList.style.maxHeight == "0px") {
        menuList.style.maxHeight = "500px";
      } else {
        menuList.style.maxHeight = "0px";
      }
    }

     const task = document.getElementById("task");
     const addTaskBtn = document.getElementById("add-task-btn");
     const taskContainer = document.getElementById("tasks-container");
     addTaskBtn.addEventListener("click",() => {
         const todoWrapper = document.createElement("div");
         const deleteButton = document.createElement("button");
         const taskText = document.createElement("p");
       todoWrapper.classList.add("todo-container");
       deleteButton.classList.add("delete-button");
        deleteButton.textContent = ("DELETE");
        taskText.classList.add("task-text");
        taskText.textContent = (task.value);
        todoWrapper.append(taskText);
        todoWrapper.append(deleteButton);
        taskContainer.append(todoWrapper);
         deleteButton.addEventListener("click",() =>{
             todoWrapper.remove();
          })
       task.value = ""
     });

    //  shiine
  function clock() {
            var monthNames = ["January", "February", "March", "April",
                "May", "June", "July", "August",
                "September", "October", "November", "December"];
            var dayNames = ["sunday", "monday", "Tuesday", "wednesday",
                "Thursday", "friday", "saturday",]

            var today = new Date();

            document.getElementById('date').innerHTML =
                dayNames[today.getDay()] + ' ' +
                today.getDate() + ' ' +
                monthNames[today.getMonth()] + ' ' +
                today.getFullYear();
            var h = today.getHours();
            var m = today.getMinutes();
            var s = today.getSeconds();

            var day = h < 11 ? 'AM' : 'PM';

            h = h < 10 ? '0' + h : h;
            m = m < 10 ? '0' + m : m;
            s = s < 10 ? '0' + s : s;

            document.getElementById('hours').innerHTML = h;
            document.getElementById('min').innerHTML = m;
            document.getElementById('sec').innerHTML = s;
            clock();
        } var inter = setInterval(clock, 400);
  </script> 
    
</body>
</html>
