<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./clock.css">
    <title>clock</title>
    <style>
        body {
    background-color: rgb(31, 72, 60);
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

#clock {
    position: relative;
    height: 20vw;
    width: 20vw;
    border: 1px solid #282828;
    box-shadow: inset 1px 1px 5px #00000000, 1px 1px #00000000;
    border-radius: 50%;
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
}

#clockinner {
    position: relative;
    background: #282828;
    overflow: hidden;
    width: 100%;
    height: 100%;
    border-radius: 100%;
}

#clockinner::after {
    -webkit-transform: rotate(90deg);
    -moz-transform: rotate(90deg);
    transform: rotate(90deg);

}

#clockinner::after,
#clockinner::before,
#clockinner .marking {
    content: '';
    position: absolute;
    width: 5px;
    height: 100%; 
    background: #0eb6d8;
    z-index: 0;
    left: 50%;
    top: 0%;
}
 
#clockinner .marking {
    background: #bdbdcb;
    width: 3px;
}

#clockinner .marking.marking-one {
    -webkit-transform: rotate(30deg);
    -moz-transform: rotate(30deg);
    transform: rotate(30deg);
}

#clockinner .marking.marking-two {
    -webkit-transform: rotate(60deg);
    -moz-transform: rotate(60deg);
    transform: rotate(60deg);
}

#clockinner .marking.marking-three {
    -webkit-transform: rotate(120deg);
    -moz-transform: rotate(120deg);
    transform: rotate(120deg);

}

#clockinner .marking.marking-four {
    -webkit-transform: rotate(150deg);
    -moz-transform: rotate(150deg);
    transform: rotate(150deg);
}
.clockface{
    position: absolute;
    top: 10%;
    left: 10%;
    width: 80%;
    height: 80%;
    background: #282828;
    border-radius: 100%;
    -webkit-border-radius: 100%;
    -moz-border-radius: 100%;
    z-index: 1;
}
#inner{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 16px;
    border-radius: 18px;
    margin-left: -9px;
    margin-top: -6px;
    background: #4d4b63;
    z-index: 11;
}

#hour,#minute,#second{
    position: absolute;
    border-radius: 10px;
    transform-origin: bottom;
    z-index: 5;
}
#hour {
    background: #68A6f6;
    width: 2.4%;
    height: 25%;
    top: 26%;
    left: 48.85%;
    opacity: 0.8;
}
#minute{
    background-color: #68A6F6;
    width: 2%;
    height: 30%;
    top: 20%;
    left: 48.9%;
    opacity: 0.8;
}
#second{
    background: #AA7C51;
    width: 1.6%;
    height: 40%;
    top: 10%;
    left: 49.25%;
    opacity: 0.8;
}


     
    </style>
</head>
<body>
    <div id="clock">
        <div id="clockinner">
            <div class="marking marking-one"></div>
            <div class="marking marking-two"></div>
            <div class="marki ng marking-three"></div>
            <div class="marking marking-four"></div>

            <div class="clockface"></div>

            <div id="inner"></div>

            <div id="hour"></div>
            <div id="minute"></div>
            <div id="second"></div>
        </div>
    </div> 
    <script>
        let hour = document.getElementById("hour");
        let minute = document.getElementById("minute")
        let second = document.getElementById("second")
        setInterval(() => {
            d = new Date();
            hr = d.getHours();
            min = d.getMinutes();
            sec = d.getSeconds();
            hr_rotation = 30 * hr + min / 2;
            min_rotation = 6 * min;
            sec_rotation = 6 * sec;

            hour.style.transform = `rotate(${hr_rotation}deg)`;
            minute.style.transform = `rotate(${min_rotation}deg)`;
            second.style.transform = `rotate(${sec_rotation}deg)`;
        }, 1000);
    </script>
</body>

</html>
